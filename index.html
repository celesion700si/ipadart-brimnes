<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRIMNES 高櫃・3D 組裝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.08);
    --blue:#0058a3; --blue-d:#004a8a; --yellow:#ffdb00;
    --card:rgba(255,255,255,.86); --bg:#e6e3dd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  #stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;background:#f3f1ec;overflow:hidden;container-type:size;user-select:none}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #gl:active{cursor:grabbing}

  /* ---- 進度條 ---- */
  #progress{position:absolute;left:0;right:0;top:0;height:.45cqw;min-height:3px;background:rgba(0,0,0,.07);z-index:5}
  #progress i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--blue);transition:width .25s linear}
  #progress b{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.7)}
  #topbar{position:absolute;left:2cqw;right:2cqw;top:1.6cqw;display:flex;align-items:flex-start;justify-content:space-between;z-index:5;pointer-events:none;opacity:0;transition:opacity .5s}
  .on #topbar{opacity:1}
  #step{pointer-events:none}
  #step .n{font-size:.95cqw;font-weight:700;letter-spacing:.12em;color:var(--blue)}
  #step .t{font-size:1.7cqw;font-weight:700;margin-top:.25cqw}
  #step .h{font-size:.85cqw;color:var(--muted);margin-top:.4cqw}
  #audio{pointer-events:auto;display:flex;align-items:center;gap:.7cqw;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:99px;padding:.45cqw .9cqw .45cqw .5cqw}
  #audio button{all:unset;cursor:pointer;width:2cqw;height:2cqw;display:grid;place-items:center;border-radius:50%}
  #audio button:hover{background:rgba(0,0,0,.06)}
  #audio svg{width:1.25cqw;height:1.25cqw}
  #audio span{font-size:.8cqw;color:var(--muted);white-space:nowrap}
  #vol{-webkit-appearance:none;appearance:none;width:7cqw;height:.3cqw;border-radius:9px;background:linear-gradient(var(--blue),var(--blue)) 0/50% 100% no-repeat,#d6d3cc;outline:none;cursor:pointer}
  #vol::-webkit-slider-thumb{-webkit-appearance:none;width:1cqw;height:1cqw;border-radius:50%;background:#fff;border:2px solid var(--blue)}
  #vol::-moz-range-thumb{width:1cqw;height:1cqw;border-radius:50%;background:#fff;border:2px solid var(--blue)}

  /* ---- 字幕 ---- */
  #sub{position:absolute;left:50%;bottom:3.2cqw;transform:translateX(-50%);max-width:52cqw;text-align:center;z-index:5;pointer-events:none}
  #sub span{display:inline-block;background:rgba(20,20,22,.78);color:#fff;font-size:1.55cqw;line-height:1.5;font-weight:500;padding:.5cqw 1.3cqw;border-radius:.7cqw;letter-spacing:.03em;transition:opacity .2s}
  #sub span:empty{opacity:0}

  /* ---- 控制鈕 ---- */
  #ctrl{position:absolute;left:2cqw;bottom:2.4cqw;display:flex;gap:.7cqw;z-index:6;opacity:0;transform:translateY(1cqw);pointer-events:none;transition:opacity .35s,transform .35s}
  #ctrl.show{opacity:1;transform:none;pointer-events:auto}
  .btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:.5cqw;font-size:1.05cqw;font-weight:500;padding:.8cqw 1.4cqw;border-radius:99px;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 .3cqw 1.2cqw rgba(0,0,0,.08);transition:transform .15s,background .15s}
  .btn:hover{transform:translateY(-2px);background:#fff}
  .btn:active{transform:translateY(0)}
  .btn svg{width:1.1cqw;height:1.1cqw}
  .btn.primary{background:var(--blue);color:#fff;border-color:transparent}
  .btn.primary:hover{background:var(--blue-d)}
  .btn.done{background:var(--yellow);color:var(--ink)}
  .btn.done:hover{background:#ffe433}
  .btn[disabled]{opacity:.35;pointer-events:none}
  #playing{position:absolute;left:2cqw;bottom:2.4cqw;z-index:5;font-size:.85cqw;color:var(--muted);display:flex;align-items:center;gap:.5cqw;transition:opacity .3s}
  #playing i{width:.55cqw;height:.55cqw;border-radius:50%;background:var(--blue);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.25}}

  /* ---- 說明書縮圖 ---- */
  #thumb{position:absolute;right:2cqw;bottom:2.4cqw;display:inline-flex;align-items:center;gap:.5em;padding:.7em 1.1em;min-height:44px;box-sizing:border-box;background:#fff;border-radius:999px;box-shadow:0 .4cqw 1.6cqw rgba(0,0,0,.14);color:inherit;text-decoration:none;font-size:max(13px,.95cqw);font-weight:500;z-index:6;opacity:0;transition:opacity .4s,transform .2s}
  .on #thumb{opacity:1}
  #thumb:hover{transform:translateY(-3px)}
  #thumb em{font-style:normal;color:var(--muted)}

  /* ---- 開始畫面 ---- */
  #intro{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding-left:8cqw;background:linear-gradient(90deg,rgba(243,241,236,.97) 0%,rgba(243,241,236,.9) 38%,rgba(243,241,236,0) 70%);transition:opacity .7s}
  #intro.hide{opacity:0;pointer-events:none}
  #intro .k{font-size:1cqw;letter-spacing:.3em;font-weight:700;color:var(--blue)}
  #intro h1{font-size:6cqw;font-weight:900;letter-spacing:.02em;line-height:1.05;margin-top:1cqw}
  #intro p{font-size:1.3cqw;color:var(--muted);margin-top:1.2cqw;line-height:1.7}
  #intro .meta{display:flex;gap:1.6cqw;margin-top:2cqw;font-size:.95cqw;color:var(--muted)}
  #intro .meta b{display:block;font-size:1.6cqw;color:var(--ink);font-weight:700}
  #startBtn{margin-top:3cqw;font-size:1.4cqw;padding:1.1cqw 2.4cqw;gap:.8cqw}
  #startBtn svg{width:1.3cqw;height:1.3cqw}

  #hint{position:absolute;left:50%;top:1.8cqw;transform:translateX(-50%);font-size:.8cqw;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:.35cqw .9cqw;border-radius:99px;z-index:5;opacity:0;transition:opacity .6s;pointer-events:none}
  #hint.show{opacity:1}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
  #doneMsg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);z-index:31;text-align:center;opacity:0;pointer-events:none;transition:opacity .4s,transform .6s cubic-bezier(.2,1.6,.4,1)}
  #doneMsg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #doneMsg b{display:block;font-size:5cqw;font-weight:900;color:var(--blue);text-shadow:0 .3cqw 0 var(--yellow)}
  #doneMsg span{font-size:1.4cqw;color:var(--ink);font-weight:500}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>

  <div id="progress"><i></i></div>
  <div id="topbar">
    <div id="step"><div class="n"></div><div class="t"></div><div class="h">拖曳畫面可旋轉視角</div></div>
    <div id="audio">
      <button id="muteBtn" title="背景音樂靜音"></button>
      <input id="vol" type="range" min="0" max="1" step="0.01" value="0.5" title="背景音樂音量">
      <span>背景音樂</span>
    </div>
  </div>

  <div id="sub"><span></span></div>
  <div id="playing" style="opacity:0"><i></i>播放中</div>
  <div id="ctrl">
    <button class="btn" id="prevBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>上一步</button>
    <button class="btn" id="replayBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>重播</button>
    <button class="btn primary" id="nextBtn">繼續<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>

  <a id="thumb" href="https://www.ikea.com.tw/" target="_blank" rel="noopener">IKEA 官方說明書 <em>p.<span></span></em> ↗</a>

  <div id="intro">
    <div class="k">林英斌老師的多元智能課 · 3D 組裝</div>
    <h1>BRIMNES<br>高櫃</h1>
    <p>以 IKEA BRIMNES 高櫃為例。跟著 3D 動畫與語音旁白，一步一步完成組裝。<br>每段結束會自動暫停，準備好再按「繼續」。</p>
    <div class="meta"><div><b>31</b>組裝步驟</div><div><b>22</b>段動畫</div><div><b>2</b>個抽屜</div></div>
    <button class="btn primary" id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.5-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg>開始組裝</button>
  </div>
  <div id="hint">按住拖曳可旋轉視角 · 滾輪縮放</div>
  <div id="doneMsg"><b>組裝完成！</b><span>享受你的新 BRIMNES 高櫃</span></div>
</div>

<script src="narration.js"></script>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const NAR = window.NARRATION;
const $ = s => document.querySelector(s);
const V = a => Array.isArray(a) ? new THREE.Vector3(...a) : a.clone();
const Y = new THREE.Vector3(0, 1, 0);
const PI = Math.PI;
const clamp01 = x => Math.min(1, Math.max(0, x));
const ease = u => u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3) / 2;
const easeBack = u => { const c = 1.9; return 1 + (c+1)*Math.pow(u-1,3) + c*Math.pow(u-1,2); };

/* =====================================================================
   3D 基礎
   ===================================================================== */
const stage = $('#stage'), canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#f3f1ec');
const camera = new THREE.PerspectiveCamera(34, 16/9, 1, 4000);
camera.position.set(170, 140, 260);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.enablePan = false; controls.minDistance = 25; controls.maxDistance = 900;
controls.maxPolarAngle = PI * .495;
controls.target.set(0, 90, 0);

scene.add(new THREE.HemisphereLight('#ffffff', '#d8d2c6', 2.1));
const sun = new THREE.DirectionalLight('#ffffff', 2.3);
sun.position.set(150, 330, 300);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -260, right: 260, top: 260, bottom: -260, near: 50, far: 900 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = .4;
scene.add(sun);
const fill = new THREE.DirectionalLight('#fff4e6', .6); fill.position.set(-200, 120, -80); scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.ShadowMaterial({ opacity: .14 }));
ground.rotation.x = -PI/2; ground.receiveShadow = true; scene.add(ground);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  fx.resize();
}

/* ---- 材質 ---- */
const MAT = {
  board: () => new THREE.MeshStandardMaterial({ color: '#fbfaf6', roughness: .85 }),
  hard: () => new THREE.MeshStandardMaterial({ color: '#e7e0d3', roughness: .95 }),
  wall: new THREE.MeshStandardMaterial({ color: '#efece6', roughness: 1 }),
  metal: new THREE.MeshStandardMaterial({ color: '#aab2bb', metalness: .25, roughness: .4 }),
  steel: new THREE.MeshStandardMaterial({ color: '#cfd4d9', metalness: .2, roughness: .45 }),
  dark: new THREE.MeshStandardMaterial({ color: '#5a5e64', metalness: .2, roughness: .5 }),
  wood: new THREE.MeshStandardMaterial({ color: '#d9b07a', roughness: .8 }),
  plastic: new THREE.MeshStandardMaterial({ color: '#f2f2ef', roughness: .6 }),
  clear: new THREE.MeshStandardMaterial({ color: '#dfe6ea', roughness: .2, transparent: true, opacity: .85 }),
  black: new THREE.MeshStandardMaterial({ color: '#2a2b2e', roughness: .55 }),
  tool: new THREE.MeshStandardMaterial({ color: '#0058a3', roughness: .45 }),
  toolY: new THREE.MeshStandardMaterial({ color: '#ffcc00', roughness: .5 }),
  pencil: new THREE.MeshStandardMaterial({ color: '#f2c14e', roughness: .6 }),
  lead: new THREE.MeshStandardMaterial({ color: '#333', roughness: .6 }),
  mark: new THREE.MeshBasicMaterial({ color: '#2d2d2d' }),
};
const EDGE = new THREE.LineBasicMaterial({ color: '#34363a' });
const HL = new THREE.Color('#5aa0e6');

function board(w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat || MAT.board());
  m.castShadow = m.receiveShadow = true;
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), EDGE));
  return m;
}
function cyl(r, h, mat, y = 0, seg = 18) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), mat);
  m.position.y = y; m.castShadow = true; return m;
}
function box(w, h, d, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; return m;
}

/* ---- 五金（+Y 為插入方向，原點在板材表面） ---- */
function hwMesh(type) {
  const g = new THREE.Group(), M = MAT;
  switch (type) {
    case 'camDowel': g.add(cyl(.3, 1.0, M.metal, .5), cyl(.26, 1.3, M.steel, -.65)); { const s = new THREE.Mesh(new THREE.SphereGeometry(.42, 14, 10), M.steel); s.position.y = -1.45; g.add(s); } break;
    case 'dowel': g.add(cyl(.4, 3, M.wood, -.5)); break;
    case 'camLock': g.add(cyl(.8, 1.1, M.steel, .35, 24), box(1.1, .12, .22, M.dark, 0, -.22, 0)); break;
    case 'screw': g.add(cyl(.45, .25, M.metal, -.12), cyl(.14, 2, M.metal, 1)); break;
    case 'euro': g.add(cyl(.5, .3, M.metal, -.15), cyl(.26, 1.2, M.metal, .6)); break;
    case 'hammerScrew': { const s = new THREE.Mesh(new THREE.SphereGeometry(.55, 16, 8, 0, PI*2, 0, PI/2), M.metal); s.rotation.x = PI; g.add(s, cyl(.2, 2.2, M.metal, 1.1)); } break;
    case 'conScrew': g.add(cyl(.55, .3, M.metal, -.15), cyl(.3, 4, M.metal, 2)); break;
    case 'nail': g.add(cyl(.22, .08, M.dark, -.04), cyl(.06, 1.7, M.dark, .85, 8)); break;
    case 'shelfPin': g.add(cyl(.2, .8, M.metal, .4), box(1.0, .25, 1.0, M.metal, 0, -.12, 0)); break;
    case 'stop': g.add(box(.8, .45, 3, M.plastic, 0, -.22, 0), cyl(.2, .8, M.plastic, .4).translateZ(.9), cyl(.2, .8, M.plastic, .4).translateZ(-.9)); break;
    case 'bumper': g.add(cyl(.6, .25, M.clear, -.12)); break;
    case 'clip': g.add(box(1.2, .6, 1.8, M.plastic, 0, -.3, 0)); break;
    case 'washer': g.add(cyl(.6, .1, M.metal, -.05)); break;
    case 'bracket': g.add(box(2.6, .3, 6.5, M.steel, 0, .15, 0), box(2.6, 6, .3, M.steel, 0, 3, -3.1)); return g;
  }
  g.scale.setScalar(1.5);
  return g;
}

/* ---- 工具（尖端在原點，往 -Y 延伸） ---- */
function toolMesh(type) {
  const g = new THREE.Group(), M = MAT;
  if (type === 'driverF' || type === 'driverP') {
    g.add(cyl(.32, 9, M.steel, -4.5), cyl(1.25, 8.5, type === 'driverF' ? M.tool : M.toolY, -13.5, 20), cyl(1.05, 1.2, M.black, -9.2));
    if (type === 'driverF') g.add(box(.9, .6, .15, M.steel, 0, -.3, 0));
    else { const c = new THREE.Mesh(new THREE.ConeGeometry(.35, .8, 4), M.steel); c.rotation.x = PI; c.position.y = -.4; g.add(c); }
  } else if (type === 'hex') {
    g.add(cyl(.3, 3, M.black, -1.5), cyl(.3, 9, M.black, 0).rotateZ(PI/2).translateX(-3).translateY(-4.5));
    const b = g.children[1]; b.position.set(4.5, -3, 0);
  } else if (type === 'hammer') {
    g.add(box(2.2, 6.5, 2.2, M.dark, 0, -3.25, 0));
    const h = cyl(.65, 20, M.wood, 0); h.rotation.z = PI/2; h.position.set(10.5, -3.25, 0); g.add(h);
  } else if (type === 'pencil') {
    const c = new THREE.Mesh(new THREE.ConeGeometry(.45, 1.6, 12), M.wood); c.rotation.x = PI; c.position.y = -.8; g.add(c);
    const t = new THREE.Mesh(new THREE.ConeGeometry(.15, .5, 8), M.lead); t.rotation.x = PI; t.position.y = -.25; g.add(t);
    g.add(cyl(.45, 13, M.pencil, -8.1, 6), cyl(.46, 1, M.metal, -15.1, 6));
  }
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return g;
}

function label(text) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const x = c.getContext('2d');
  x.font = '700 64px "Noto Sans TC", sans-serif'; x.fillStyle = '#1d1d1f'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, 128, 66);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  s.scale.set(6, 3, 1); return s;
}

/* =====================================================================
   零件註冊
   ===================================================================== */
const PARTS = {};
function reg(name, obj, parent, pos, opt = {}) {
  const par = typeof parent === 'string' ? PARTS[parent].obj : parent;
  obj.position.copy(V(pos)); par.add(obj);
  PARTS[name] = { name, obj, home: V(pos), dir: opt.dir || null, mat: opt.mat || null, base: opt.mat ? opt.mat.color.clone() : null };
  return obj;
}
function addBoard(name, parent, dims, pos, mat) {
  const m = board(...dims, mat); reg(name, m, parent, pos, { mat: m.material }); return m;
}
function addHW(name, type, parent, pos, dir) {
  const g = new THREE.Group(), inner = hwMesh(type);
  const d = dir ? V(dir).normalize() : null;
  if (d) inner.quaternion.setFromUnitVectors(Y, d);
  g.add(inner); reg(name, g, parent, pos, { dir: d }); return g;
}

/* ---- 櫃體（直立座標：寬 X、高 Y、正面 +Z，單位 cm） ---- */
const cabPivot = new THREE.Group(), cabInner = new THREE.Group();
cabInner.position.set(0, -96, 0); cabPivot.add(cabInner); scene.add(cabPivot);

addBoard('sideF', cabInner, [1.8, 190, 35], [-29.1, 95, 0]);
addBoard('sideT', cabInner, [1.8, 190, 35], [29.1, 95, 0]);
addBoard('bottomP', cabInner, [56.4, 1.8, 33.5], [0, 8.9, -.75]);
addBoard('plinth', cabInner, [56.4, 8, 1.8], [0, 4, 16.6]);
addBoard('shelfF', cabInner, [56.4, 1.8, 33.5], [0, 64, -.75]);
addBoard('top', cabInner, [60, 1.8, 35.5], [0, 190.9, 0]);
addBoard('back', cabInner, [60, 191.5, .3], [0, 95.9, -17.65], MAT.hard());
[95, 125, 158].forEach((y, i) => addBoard('shelf' + i, cabInner, [56, 1.8, 32], [0, y, -.5]));
{ const w = new THREE.Mesh(new THREE.BoxGeometry(320, 260, 1), MAT.wall); w.receiveShadow = true; reg('wall', w, cabInner, [0, 130, -18.9]); }

// 側板上的凸輪螺絲、滑軌與螺絲
const CAM_Y = [8.9, 64], RUN_Y = [13.5, 41];
for (const [side, sx] of [['F', 1], ['T', -1]]) {
  const host = 'side' + side; let i = 0;
  for (const y of CAM_Y) for (const z of [-12, 12]) addHW(`cd${side}${i++}`, 'camDowel', host, [sx*.9, y-95, z], [-sx, 0, 0]);

/* =====================================================================
   狀態重播：每一幀從頭套用所有動作，確保上一步／重播都正確
   ===================================================================== */
const ST = {};
for (const n in PARTS) ST[n] = { vis: false, off: new THREE.Vector3(), rot: [0, 0, 0], sc: 1, hl: 0 };
const ORS = { cab: {}, drw: {} };
const _v = new THREE.Vector3();

function runActs(sc, t) {
  const who = sc.g === 'drw' ? 'drw' : 'cab';
  for (const a of sc.acts) {
    if (t < a.t) continue;
    const u = a.d ? clamp01((t - a.t) / a.d) : 1;
    if (a.p) {
      const s = ST[a.p], e = a.pop ? easeBack(u) : ease(u);
      s.vis = true;
      const f = a.from || [0, 0, 0], to = a.to || [0, 0, 0];
      s.off.set(f[0] + (to[0]-f[0])*e, f[1] + (to[1]-f[1])*e, f[2] + (to[2]-f[2])*e);
      if (a.arc) s.off.add(_v.set(...a.arc).multiplyScalar(Math.sin(PI*e)));
      const rf = a.rf || [0, 0, 0], rt = a.rt || [0, 0, 0];
      s.rot = rf.map((r, i) => r + (rt[i]-r)*e);
      s.sc = a.pop ? Math.max(e, .001) : 1;
      s.hl = a.pop ? 0 : (u < 1 ? 1 : Math.max(0, 1 - (t - a.t - a.d) / .9));
    } else if (a.orient) {
      const o = ORS[a.who || who], tgt = ORI[a.who || who][a.orient], e = ease(u);
      if (u >= 1) { o.q.copy(qOf(tgt.e)); o.py = tgt.py; }
      else { o.q = o.q.clone().slerp(qOf(tgt.e), e); o.py = restHeight(a.who || who, o.q) + (a.lift || 0)*Math.sin(PI*e); }
    }
  }
}
function applyScene(k, t) {
  for (const n in ST) { const s = ST[n]; s.vis = false; s.off.set(0, 0, 0); s.rot = [0, 0, 0]; s.sc = 1; s.hl = 0; }
  ORS.cab = { q: qOf(ORI.cab.side.e), py: ORI.cab.side.py };
  ORS.drw = { q: qOf(ORI.drw.front.e), py: ORI.drw.front.py };
  for (let j = 0; j < k; j++) runActs(S[j], Infinity);
  runActs(S[k], t);
  for (const n in PARTS) {
    const P = PARTS[n], s = ST[n];
    P.obj.visible = s.vis;
    if (!s.vis) continue;
    P.obj.position.copy(P.home).add(s.off);
    P.obj.rotation.set(...s.rot);
    P.obj.scale.setScalar(s.sc);
    if (P.mat) P.mat.color.copy(P.base).lerp(HL, s.hl * .55);
  }
  cabPivot.quaternion.copy(ORS.cab.q); cabPivot.position.y = ORS.cab.py;
  drwPivot.quaternion.copy(ORS.drw.q); drwPivot.position.y = ORS.drw.py;
  const g = S[k].g;
  cabPivot.visible = g === 'cab' || g === 'final';
  drwPivot.visible = g === 'drw';
  introG.forEach((ig, i) => ig.visible = g === 'intro' + i);
}

let TR = [];
function buildTransients(k) {
  TR.forEach(o => o.root.parent && o.root.parent.remove(o.root));
  TR = [];
  const host = S[k].g === 'drw' ? drwInner : cabInner;
  for (const a of S[k].acts) {
    if (a.tool) {
      let parent = host, at, dir;
      if (a.on) { const P = PARTS[a.on]; parent = P.obj.parent; at = P.home.clone(); dir = P.dir.clone(); }
      else { at = V(a.at); dir = V(a.dir).normalize(); }
      const root = new THREE.Group(), orient = new THREE.Group(), spin = new THREE.Group();
      orient.quaternion.setFromUnitVectors(Y, dir);
      spin.add(toolMesh(a.tool)); orient.add(spin); root.add(orient); parent.add(root);
      TR.push({ a, root, spin, at, dir, to: a.to ? V(a.to) : null });
    } else if (a.mark) {
      const A = V(a.mark[0]), B = V(a.mark[1]), len = A.distanceTo(B);
      const m = new THREE.Mesh(new THREE.BoxGeometry(1, .55, .55), MAT.mark);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), B.clone().sub(A).normalize());
      host.add(m); TR.push({ a, root: m, A, B, len });
    } else if (a.arrow) {
      const g = new THREE.Group(), inner = new THREE.Group();
      inner.add(cyl(.7, 7, MAT.black, -7.5));
      const c = new THREE.Mesh(new THREE.ConeGeometry(2, 4, 20), MAT.black); c.rotation.x = PI; c.position.y = -2; inner.add(c);
      inner.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), V(a.dir).normalize());
      g.add(inner); host.add(g); TR.push({ a, root: g, at: V(a.arrow), dir: V(a.dir).normalize() });
    }
  }
}
function updateTransients(t) {
  for (const o of TR) {
    const a = o.a, u = (t - a.t) / a.d;
    if (a.mark) {
      o.root.visible = t >= a.t;
      const e = ease(clamp01(u)), L = Math.max(o.len * e, .01);
      o.root.scale.x = L;
      o.root.position.copy(o.A).lerp(o.B, e / 2);
      continue;
    }
    const vis = u >= 0 && u <= 1;
    o.root.visible = vis;
    if (!vis) continue;
    const s = Math.max(.001, Math.min(1, u*7, (1-u)*7));
    if (a.arrow) {
      o.root.scale.setScalar(s);
      o.root.position.copy(o.at).addScaledVector(o.dir, 2.2*Math.sin(u*PI*4) - 2);
      continue;
    }
    o.root.scale.setScalar(s);
    const back = 7*(1 - ease(clamp01(u/.2))) + 7*ease(clamp01((u - .82)/.18));
    let pos = o.at, dist = back;
    if (a.mode === 'spin') o.spin.rotation.y = -u * a.d * 7;
    else if (a.mode === 'hammer') dist = back + 3.5*Math.abs(Math.sin(u*PI*Math.max(2, Math.round(a.d*2.6))));
    else if (a.mode === 'tap') dist = 3*Math.abs(Math.sin(u*PI));
    else if (a.mode === 'draw') pos = o.at.clone().lerp(o.to, ease(clamp01((u - .12)/.76)));
    o.root.position.copy(pos).addScaledVector(o.dir, -dist);
  }
}

  const dt = Math.min(clock.getDelta(), .05);
  if (cur >= 0) {
    if (playing && !frozen) {
      time += dt;
      for (const a of S[cur].acts) if (a.cam && time >= a.t && !firedCams.has(a)) { firedCams.add(a); if (!userCam) camTo(a.cam, 1.8); }
      const doneAnim = time >= dur, voiceDone = voiceFailed || voice.ended || (time > NAR[cur].dur + 3);
      if (doneAnim && voiceDone) finishScene();
      progI.style.width = ((cur + Math.min(time / dur, 1)) / S.length * 100) + '%';
    } else progI.style.width = ((cur + 1) / S.length * 100) + '%';
    applyScene(cur, time);
    updateTransients(time);
    updateSub(cur, time);
    const g = S[cur].g;
    if (g.startsWith('intro')) introG[+g.slice(5)].rotation.y = Math.sin(performance.now() / 2600) * .22;
  }
  if (camTw) {
    camTw.u += dt / camTw.dur; const e = ease(clamp01(camTw.u));
    camera.position.lerpVectors(camTw.p0, camTw.p1, e); controls.target.lerpVectors(camTw.t0, camTw.t1, e);
    if (camTw.u >= 1) camTw = null;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
